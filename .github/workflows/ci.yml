name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the baseline documented in README.md.
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/main.dart lib/screens lib/services lib/theme lib/models test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
