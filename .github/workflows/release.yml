name: Release

# Pushing a tag such as v1.0.0 builds a signed Android APK and publishes it
# on the GitHub Releases page under that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the baseline documented in README.md.
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Restore the signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Name the APK after the tag and add a checksum
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "letterchamp-${GITHUB_REF_NAME}.apk"
          sha256sum "letterchamp-${GITHUB_REF_NAME}.apk" > "letterchamp-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "letterchamp-${GITHUB_REF_NAME}.apk" \
            "letterchamp-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Letter Champ $GITHUB_REF_NAME" \
            --generate-notes
